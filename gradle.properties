pluginGroup=com.mio.irondome
pluginVersion=0.1.0

# Menor versão suportada: compilar contra ela garante compatibilidade com as mais novas.
# Ao mudar, atualize IdeSupport.TESTED_BUILD e TESTED_VERSION com o build desta versão.
platformVersion=2025.2.6.3
pluginSinceBuild=252
# IDEs mais novas que o verifyPlugin confere (IntelliJ IDEA unificada).
verifierIdeVersions=2025.3.6.2,2026.2.4

# A IDE já traz a stdlib do Kotlin.
kotlin.stdlib.default.dependency=false

org.gradle.configuration-cache=true
org.gradle.caching=true
